<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Làm bài thi</title>
<script>(function(){var d=document.documentElement;d.setAttribute("data-theme", localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));d.setAttribute("data-palette", localStorage.getItem("palette") || "9");})();</script>
<link rel="stylesheet" href="css/style.css">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<script>
  // MathJax config — thư viện được tải lười (lazy) khi cần công thức Toán / Lý / Hóa
  window.MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'] },
    startup: { typeset: false }
  };
  window.loadMathJax = function() {
    if (window._mjLoading) return window._mjLoading;
    window._mjLoading = new Promise(function(resolve) {
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js';
      s.crossOrigin = 'anonymous';
      s.async = true;
      s.onload = resolve;
      document.head.appendChild(s);
    });
    return window._mjLoading;
  };
</script>
</head>
<body>

<header class="site-header">
  <h1 id="exam-title-header">Giao diện làm bài thi</h1>
  <div class="badge" id="exam-type-badge"></div>
</header>
<nav class="top-nav">
  <button class="hamburger" id="hamburger-btn" aria-label="Menu">☰</button>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Trang chủ</a>
    <a href="explore.html" class="nav-link">Tìm đề thi</a>
    <a href="on-tap.html" class="nav-link">Ôn theo dạng</a>
    <a href="lich-su.html" class="nav-link">Lịch sử</a>
    <a href="ung-ho.html" class="nav-link">Ủng hộ</a>
  </div>
  <div class="nav-controls">
    <select id="palette-select" class="palette-select" aria-label="Chọn tông màu">
      <option value="1">🔵 Xanh dương - be ấm</option>
      <option value="2">🟢 Xanh lá - cam đất</option>
      <option value="3">🟣 Tím - hồng pastel</option>
      <option value="4">🔷 Navy dịu + màu môn học</option>
      <option value="5">🌊 Đại dương cyan</option>
      <option value="6">🌸 Hoa anh đào</option>
      <option value="7">🔥 Lửa ấm</option>
      <option value="8">🌿 Rừng xanh</option>
      <option value="9">🖤 Monochrome</option>
      <option value="10">☕ Cà phê vintage</option>
    </select>
    <button class="theme-toggle" id="theme-toggle" aria-label="Chuyển giao diện">🌙</button>
  </div>
</nav>

<div class="exam-topbar">
  <div class="candidate-info">
    <span class="status-dot"></span>Đang kết nối &nbsp;|&nbsp;
    Thí sinh: <b>Khách (không cần đăng nhập)</b> &nbsp;|&nbsp;
    Môn thi: <b id="candidate-subject">-</b>
  </div>
  <div class="timer-box">
    <span class="timer-label">Thời gian còn lại</span>
    <span class="timer" id="timer">--:--</span>
  </div>
</div>
<div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>


<div id="exam-loading" class="container"><p>Đang tải đề thi...</p></div>

<div id="exam-body" class="exam-body" style="display:none;">
  <div class="question-panel">
    <div id="passage-slot"></div>
    <div class="question-head">
      <div class="qnum" id="question-number"></div>
      <button class="btn secondary" id="flag-btn" style="font-size:12px;padding:6px 12px;">Đánh dấu câu hỏi</button>
    </div>
    <div class="question-content" id="question-content"></div>
    <div id="question-answer-area"></div>
    <div class="nav-row">
      <button class="btn secondary" id="prev-btn">&larr; Câu trước</button>
      <button class="btn" id="next-btn">Câu tiếp &rarr;</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="side-title">Danh sách câu hỏi <span class="count" id="answered-count"></span></div>
    <div class="qgrid" id="qgrid"></div>
    <div class="legend">
      <div><span class="dot" style="background:var(--green-600);"></span>Đã trả lời</div>
      <div><span class="dot" style="background:var(--blue-500);"></span>Đang xem</div>
      <div><span class="dot" style="background:var(--white);border:1px solid var(--line);box-shadow:0 0 0 2px var(--amber-600) inset;"></span>Đã đánh dấu</div>
      <div><span class="dot" style="background:var(--white);border:1px solid var(--line);"></span>Chưa trả lời</div>
    </div>
    <div class="submit-bar">
      <button class="btn" id="submit-btn">Nộp bài</button>
    </div>
  </div>
</div>

<div id="result-slot"></div>

<script src="js/theme.js"></script>
<script src="js/exam.js?v=20260819-1"></script>
<script src="js/calculator.js?v=20260819-1"></script>
<script src="js/whiteboard.js?v=20260819-1"></script>
<script src="js/translate.js?v=20260819-1"></script>
<script src="js/security.js?v=20260821-1"></script>
<script src="js/shield.js?v=20260821-1"></script>
<script src="js/sw-register.js?v=20260819-1"></script>
</body>
</html>
